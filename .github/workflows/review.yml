name: review

# Change-scoped review gate:
#   analyze  -> build the index the rules need
#   review-rules --duplication  -> one task sheet (rules + clone kinds), gates on error findings
#   test-select  -> which tests this change actually reaches
# SARIF goes to code scanning, the markdown task sheet to the step summary (and a PR comment).

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  security-events: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # --baseline-from-ref needs the base branch

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci --no-audit --no-fund || npm install --no-audit --no-fund

      # The bench/ fixtures are customer-code copies and stay out of git, so the
      # tests that need them (impact, routes, resolver, vue-symbols, …) cannot run
      # here. This is the fixture-independent subset; the full suite runs locally.
      - name: Unit tests (fixture-independent subset)
        run: |
          node --test \
            tests/changes.test.mjs \
            tests/deep.test.mjs \
            tests/duplication.test.mjs \
            tests/impact-analysis.test.mjs \
            tests/navigation.test.mjs \
            tests/review-rules.test.mjs \
            tests/test-select.test.mjs \
            tests/engines/codegraph.test.mjs \
            tests/engines/fusion.test.mjs \
            tests/engines/mcp-tools.test.mjs \
            tests/resolver/alias.test.mjs

      - name: Build index
        run: node src/index.js analyze .

      # Functional self-check: every designed capability, on a throwaway repo
      # (fixture-dependent checks skip themselves when bench/ is absent).
      - name: Self-test (designed capabilities)
        run: node scripts/selftest.mjs

      - name: Review task sheet (rules + duplication)
        id: review
        continue-on-error: true
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref || '' }}
        run: |
          set -o pipefail
          if [ -n "$BASE_REF" ]; then
            SCOPE_ARGS="--scope compare --base origin/$BASE_REF"   # PR: diff against the base branch
          elif git rev-parse -q --verify HEAD~1 >/dev/null; then
            # push to main: review the pushed commit, not a (clean) empty tree —
            # --scope all on a fresh checkout reports "0 files changed"
            SCOPE_ARGS="--scope compare --base HEAD~1"
          else
            SCOPE_ARGS="--scope all"
          fi
          # --dup-max-new-clones 6 is calibrated on measured cases: a legitimate
          # rule-table addition (Python patterns) produced 4 new *renamed* clones in
          # one file, and structuring data tables alike is not copy-paste. The real
          # incident (a 13-line verbatim copy) was 1 exact clone, still caught.
          node scripts/review-rules.mjs . $SCOPE_ARGS \
            --mode deep \
            --impact --impact-depth 4 \
            --deep \
            --duplication --dup-kinds renamed,similar \
            --dup-baseline-from-ref "origin/${BASE_REF:-HEAD}" \
            --dup-max-new-clones 6 \
            --markdown review.md \
            --sarif review.sarif \
            --json > review.json \
            --gate | tee review.txt
          echo "exit=$?" >> "$GITHUB_OUTPUT"

      - name: Step summary
        if: always()
        run: |
          {
            echo "### Review task sheet"
            if [ -f review.md ]; then cat review.md; else echo "_(review.md not produced — see job log)_"; fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload SARIF to code scanning
        if: always() && hashFiles('review.sarif') != ''
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: review.sarif
          category: archnav-review

      - name: Which tests this change reaches
        if: always()
        run: node scripts/test-select.mjs . --json | head -c 4000 || true

      - name: Comment the task sheet on the PR
        if: always() && github.event_name == 'pull_request' && hashFiles('review.md') != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh pr comment "${{ github.event.pull_request.number }}" --body-file review.md

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: review-report
          path: |
            review.md
            review.json
            review.sarif

      - name: Fail the job when the gate failed
        if: steps.review.outcome == 'failure' || steps.review.outputs.exit != '0'
        run: |
          echo "review-rules --gate reported blocking findings; see the task sheet above." >&2
          exit 1
